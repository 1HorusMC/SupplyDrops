name: HorusSupplyDrops
version: '${version}'
main: com.horus.supplydrops.HorusSupplyDropsPlugin
api-version: '1.21'
authors: [Horus]
description: Supply drops configurables con hologramas nativos TextDisplay, loot ponderado, WorldGuard y Discord Webhook.
softdepend: [WorldGuard]

commands:
  supplydrop:
    description: Administra los eventos de Supply Drops.
    usage: /supplydrop <start|stop|reload>
    permission: horussupplydrops.admin
    aliases: [sd, supplydrops]

permissions:
  horussupplydrops.admin:
    description: Permite usar todos los comandos de administración de HorusSupplyDrops.
    default: op
